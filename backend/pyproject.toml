[build-system]
# Tells pip what tools it needs to build your package
requires = ["setuptools>=61.0.0"]
build-weather-app = "setuptools.build_meta"

[project]
# Core information about Weather API project
name = "weather-app"
version = "0.1.0"
description = "Weather API"
authors = [
    { name = "Hlina"}
]
# Defines which version of Python you need
requires-python = ">=3.10"

# Other external libraries your code relies on
dependencies = [
    "requests>=2.34.2",
]

[tool.setuptools]
packages = ["wapp"]
